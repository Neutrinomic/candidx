[package]
name = "candidx"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Value-based canonical Candid encoding for the cx profile"
publish = false

[features]
default = ["std", "candid"]
std = []
candid = ["std", "dep:candid"]
fuzz = ["candid", "candid/value"]

[dependencies]
candid = { version = "0.10.37", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[[example]]
name = "evolution"
required-features = ["candid"]

[[example]]
name = "fuzz"
required-features = ["fuzz"]

[[example]]
name = "bench"
required-features = ["candid"]

[[example]]
name = "profile"
required-features = ["candid"]
